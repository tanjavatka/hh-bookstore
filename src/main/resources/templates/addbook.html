<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Latest compiled and minified CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

  <title>Add a Book</title>
</head>

<body>
  <div class="container">
    <h2>New Book</h2>

    <div class="col-ms-4">

      <form th:object="${book}" th:action="@{save}" action="#" method="post">

        <div class="form-group">
          <label for="title">Title</label>
          <input type="text" id="title" th:field="*{title}" class="form-control">
        </div>

        <div class="form-group">
          <label for="author">Author</label>
          <input type="text" id="author" th:field="*{author}" class="form-control">
        </div>

        <div class="form-group">
          <label for="year">Year</label>
          <input type="text" id="year" th:field="*{publicationYear}" class="form-control">
        </div>

        <div class="form-group">
          <label for="price">Price</label>
          <input type="text" id="price" th:field="*{price}" class="form-control">
        </div>

        <button type="submit" value="Save" class="btn btn-outline-info">Save</button>

      </form>

    </div>

  </div>
</body>

</html>
